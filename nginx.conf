server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ---- gzip: comprime texto antes de enviarlo al navegador ----
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;

    # HTML: siempre revalidar (para que un deploy nuevo se vea al instante)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # CSS/JS: cache largo — ya van versionados con ?v= en el HTML
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
